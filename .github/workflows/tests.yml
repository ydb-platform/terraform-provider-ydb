name: tests
on:
  push:
    branches:
      - main
      - release-*
  pull_request:
  workflow_dispatch:
jobs:
  unit:
    name: unit (${{ matrix.platform.name }}, Go ${{ matrix.go-version }})
    concurrency:
      group: unit-${{ github.ref }}-${{ matrix.platform.name }}-${{ matrix.go-version }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        go-version: [1.25.x, 1.26.x]
        platform:
          - name: linux_arm64_v8.0
            runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            cgo_enabled: "1"
            race: true
          - name: linux_amd64_v1
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            cgo_enabled: "1"
            race: true
          - name: linux_arm_6
            runner: ubuntu-latest
            emulated: true
            goos: linux
            goarch: arm
            cgo_enabled: "0"
          - name: linux_386_sse2
            runner: ubuntu-latest
            goos: linux
            goarch: "386"
            cgo_enabled: "0"
          - name: darwin_amd64_v1
            runner: macos-15-intel
            goos: darwin
            goarch: amd64
            cgo_enabled: "1"
            race: true
          - name: darwin_arm64_v8.0
            runner: macos-15
            goos: darwin
            goarch: arm64
            cgo_enabled: "1"
            race: true
    env:
      CGO_ENABLED: ${{ matrix.platform.cgo_enabled }}
      GO386: sse2
      GOAMD64: v1
      GOARCH: ${{ matrix.platform.goarch }}
      GOARM: "6"
      GOARM64: v8.0
      GOOS: ${{ matrix.platform.goos }}
      PLATFORM: ${{ matrix.platform.name }}
      GO: ${{ matrix.go-version }}
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up QEMU
        if: matrix.platform.emulated == true
        uses: docker/setup-qemu-action@v4
        with:
          platforms: arm
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true
      - name: Test with race detector
        if: matrix.platform.race == true
        run: go test -race -coverprofile unit.txt -covermode atomic ./...
      - name: Test
        if: matrix.platform.race != true
        run: go test -coverprofile unit.txt -covermode atomic ./...
      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./unit.txt
          flags: unit,${{ matrix.platform.name }},go-${{ matrix.go-version }}
          name: unit

  # Acceptance tests: YDB runs as a GitHub Actions service container. Both the stable and edge
  # images are covered so provider changes remain compatible with current and upcoming YDB versions.
  acceptance:
    name: acceptance (YDB ${{ matrix.ydb.name }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        ydb:
          - name: edge
            image: ydbplatform/local-ydb:edge
          - name: latest
            image: ydbplatform/local-ydb:latest
    services:
      ydb:
        image: ${{ matrix.ydb.image }}
        options: --hostname localhost
        env:
          YDB_FEATURE_FLAGS: "\
            enable_external_data_sources,\
            enable_replace_if_exists_for_external_entities,\
            enable_resource_pools"
        ports:
          - 2136:2136
    env:
      TF_ACC: "1"
      YDB_ACC_CONNECTION_STRING: grpc://127.0.0.1:2136/?database=/local
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.9.8
          terraform_wrapper: false
      - name: Acceptance tests
        run: go test -v -timeout 30m ./internal/terraform/...
